# Configuración Principal del Sistema de Trading

# Configuración General
general:
  project_name: "Trading System with AI"
  version: "1.0.0"
  timezone: "America/New_York"
  base_currency: "USD"

# Configuración de Datos
data:
  sources:
    - name: "yfinance"
      enabled: true
      symbols: ["AAPL", "MSFT", "GOOGL", "TSLA", "SPY"]
    - name: "binance"
      enabled: false
      symbols: ["BTC/USDT", "ETH/USDT"]
  
  update_frequency: "1m"  # 1m, 5m, 15m, 1h, 1d
  history_days: 365
  
  storage:
    type: "postgresql"  # postgresql, influxdb, csv
    path: "data/storage/"

# Configuración de Modelos IA
models:
  enabled_models:
    - "lstm"
    - "random_forest"
    - "prophet"
  
  lstm:
    sequence_length: 60
    features: ["open", "high", "low", "close", "volume"]
    epochs: 50
    batch_size: 32
    validation_split: 0.2
  
  random_forest:
    n_estimators: 100
    max_depth: 10
    features: ["rsi", "macd", "bollinger_bands", "volume_ma"]

# Configuración de Estrategias
strategies:
  default_strategy: "mean_reversion"
  
  mean_reversion:
    enabled: true
    lookback_period: 20
    entry_threshold: 2.0  # desviaciones estándar
    exit_threshold: 0.5
  
  trend_following:
    enabled: false
    fast_ma: 10
    slow_ma: 30
    stop_loss: 0.02

# Gestión de Riesgo
risk_management:
  max_position_size: 0.02  # 2% del capital
  max_daily_loss: 0.05      # 5% del capital
  max_open_positions: 5
  stop_loss_percentage: 0.02  # 2%
  take_profit_percentage: 0.04  # 4%
  
  position_sizing:
    method: "kelly"  # fixed, kelly, volatility
    kelly_fraction: 0.25  # Usar 25% del Kelly Criterion

# Backtesting
backtesting:
  initial_capital: 10000
  commission: 0.001  # 0.1%
  slippage: 0.0005   # 0.05%
  start_date: "2020-01-01"
  end_date: "2023-12-31"
  
  metrics:
    - "sharpe_ratio"
    - "max_drawdown"
    - "win_rate"
    - "profit_factor"
    - "calmar_ratio"

# Ejecución
execution:
  mode: "paper"  # paper, live, backtest
  broker: "interactive_brokers"  # interactive_brokers, binance, coinbase
  
  order_types:
    - "market"
    - "limit"
    - "stop_loss"
    - "take_profit"
  
  retry_attempts: 3
  timeout_seconds: 30

# Monitoreo
monitoring:
  dashboard:
    enabled: true
    port: 8050
    refresh_interval: 5  # segundos
  
  alerts:
    enabled: true
    channels:
      - "telegram"
      - "email"
    
    conditions:
      - type: "max_drawdown"
        threshold: 0.10  # 10%
      - type: "daily_loss"
        threshold: 0.05  # 5%
      - type: "anomaly_detection"
        enabled: true

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/trading.log"
  max_file_size_mb: 100
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

